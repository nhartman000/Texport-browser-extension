<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TExporT Markers</title>
<style>
  :root { --mark: #fde68a; --mark-edge: #d97706; --ink: #111827; --muted: #6b7280; --line: #e5e7eb; }
  body { font: 11pt/1.5 Georgia, "Times New Roman", serif; color: var(--ink); background: #fff; max-width: 820px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 20pt; margin: 0 0 4px; }
  h2 { font-size: 15pt; margin: 28px 0 4px; border-bottom: 2px solid var(--ink); padding-bottom: 4px; }
  h3 { font-size: 12pt; margin: 20px 0 6px; }
  .meta { color: var(--muted); font-size: 9.5pt; word-break: break-all; }
  .toolbar { position: sticky; top: 0; background: #fff; border-bottom: 1px solid var(--line); padding: 10px 0; margin-bottom: 16px; display: flex; gap: 8px; flex-wrap: wrap; font: 13px system-ui, sans-serif; z-index: 5; }
  .toolbar button { font: inherit; padding: 6px 12px; border: 1px solid #d1d5db; border-radius: 6px; background: #f9fafb; cursor: pointer; }
  .toolbar button.primary { background: #f59e0b; border-color: #d97706; font-weight: 600; }
  .toolbar .status { align-self: center; color: var(--muted); }
  .instructions { border: 2px solid var(--ink); padding: 12px 14px; margin: 16px 0; font-family: system-ui, sans-serif; font-size: 10pt; white-space: pre-wrap; }
  .reg-item { border-left: 5px solid var(--mark-edge); background: #fffbeb; padding: 8px 12px; margin: 10px 0; break-inside: avoid-page; }
  .reg-head { font-family: system-ui, sans-serif; font-size: 9.5pt; font-weight: 700; }
  .note { font-family: system-ui, sans-serif; font-size: 9.5pt; font-style: italic; }
  .text { white-space: pre-wrap; word-wrap: break-word; }
  .msg { margin: 10px 0; padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; }
  .msg.marked { border: 2px solid var(--mark-edge); background: #fffbeb; }
  .role { font-family: system-ui, sans-serif; font-size: 9pt; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 4px; }
  .delim { font-family: "Courier New", monospace; font-size: 9pt; font-weight: 700; color: #92400e; }
  mark { background: var(--mark); padding: 0 1px; }
  .convo { break-before: page; }
  .convo:first-of-type { break-before: auto; }
  .rm { font: 12px system-ui, sans-serif; margin-left: 8px; color: #b91c1c; background: none; border: 1px solid #fca5a5; border-radius: 4px; cursor: pointer; }
  .picker a { display: block; padding: 6px 0; font-family: system-ui, sans-serif; }
  .reg-item.over { border-left-color: #ef4444; }
  .budget-warn { background: #fef2f2; border: 1px solid #fca5a5; color: #991b1b; padding: 8px 12px; border-radius: 6px; font: 13px system-ui, sans-serif; margin-bottom: 12px; }
  .omitted { color: var(--muted); font-style: italic; margin: 8px 0; font-family: system-ui, sans-serif; font-size: 9.5pt; }
  .icm-panel { border: 2px solid #d97706; padding: 16px; margin: 16px 0; font: 14px system-ui,sans-serif; }
  .icm-panel textarea { display: block; box-sizing: border-box; width: 100%; margin: 8px 0; font: 13px monospace; }
  .icm-panel pre { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 420px; overflow: auto; }
  .icm-panel button, #icm-open { padding: 8px; margin: 6px 4px 6px 0; cursor: pointer; }
  .icm-panel input { display: block; margin: 8px 0; max-width: 100%; }
  .icm-drop { padding: 18px; border: 2px dashed #d97706; }
  @media print { .icm-panel, #icm-open { display:none !important; } }
  @media print { .budget-warn { display: none; } }
  @media print { .toolbar, .rm { display: none !important; } body { padding: 0; max-width: none; } }
</style>
</head>
<body>
  <div id="app"></div>
  <script src="settings.js"></script>
  <script src="packed.js"></script>
  <script src="icm.js"></script>
  <script src="icm-ui.js"></script>
  <script src="export.js"></script>
</body>
</html>
