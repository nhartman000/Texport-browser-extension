<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TExporT — marker window</title>
<style>
  :root { --c: #f59e0b; --bg: #0b1020; --panel: #121a2e; --line: #24304d; --ink: #f3f4f6; --mute: #9aa4b8; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 system-ui, sans-serif; padding-bottom: 96px; }
  header { position: sticky; top: 0; z-index: 2; background: rgba(11,16,32,.97); border-bottom: 1px solid var(--line); padding: 10px 14px; }
  header h1 { margin: 0; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .sub { color: var(--mute); font-size: 13px; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  button { font: inherit; font-size: 14px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; cursor: pointer; }
  button.primary { background: var(--c); color: #111; border-color: transparent; font-weight: 700; }
  button:disabled { opacity: .45; }
  .hint { color: var(--mute); font-size: 13.5px; padding: 10px 14px 0; }
  main { padding: 6px 12px; max-width: 820px; margin: 0 auto; }
  .msg { margin: 14px 0; }
  .role { display: flex; align-items: center; gap: 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--mute); }
  .role button { font-size: 12px; padding: 3px 8px; text-transform: none; letter-spacing: 0; }
  .msg.whole .role { color: var(--c); }
  .msg.whole .paras { box-shadow: -4px 0 0 0 var(--c); }
  .p { padding: 8px 10px; margin: 4px 0; border-radius: 10px; background: var(--panel); border: 1px solid transparent; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user .p { background: #1b2540; }
  .p.marked { border-color: var(--c); background: color-mix(in srgb, var(--c) 18%, var(--panel)); }
  .p mark { background: color-mix(in srgb, var(--c) 45%, transparent); color: inherit; border-radius: 3px; }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; color: #111; background: var(--c); border-radius: 4px; padding: 0 6px; margin-right: 6px; }
  .note { color: #fcd34d; font-style: italic; font-size: 13.5px; margin-top: 4px; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; display: flex; gap: 8px; align-items: center; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
         background: rgba(18,26,46,.98); border-top: 1px solid var(--line); }
  .bar .count { margin-right: auto; font-size: 14px; }
  .toast { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); z-index: 9; background: #1f2937; color: #fff; padding: 9px 14px; border-radius: 9px; font-size: 14px; max-width: 90vw; }
  .sheet { position: fixed; inset: 0; z-index: 8; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; justify-content: center; }
  .sheet > div { background: var(--panel); width: min(560px, 100vw); border-radius: 16px 16px 0 0; padding: 16px; max-height: 80vh; overflow: auto; }
  .sheet h2 { margin: 0 0 10px; font-size: 17px; }
  .sheet .opt { display: block; width: 100%; text-align: left; margin: 6px 0; }
  .sheet input { width: 100%; font: inherit; padding: 9px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .empty { color: var(--mute); padding: 30px 10px; text-align: center; }
</style>
</head>
<body>
  <header>
    <h1 id="title">TExporT marker window</h1>
    <div class="sub" id="sub">Connecting to the conversation tab…</div>
    <div class="tools">
      <button id="loadAll">Load whole chat</button>
      <button id="collect" class="primary">Add to collection…</button>
      <button id="cols">Collections</button>
    </div>
  </header>
  <div class="hint">Tap a paragraph to mark it (tap again to add a note or remove it). To mark exact words, select them, then tap <b>★ Mark selection</b>.</div>
  <main id="list"><div class="empty">Loading…</div></main>
  <div class="bar">
    <span class="count" id="count">0 markers</span>
    <button id="markNote" disabled>+ Note</button>
    <button id="markSel" class="primary" disabled>★ Mark selection</button>
  </div>
  <script src="settings.js"></script>
  <script src="marker.js"></script>
</body>
</html>
